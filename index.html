<!doctype html>
<html lang="es">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="theme-color" content="#091623">
 <meta name="description" content="Recorrido virtual interactivo con panorámicas 360°">
 <title>Recorrido virtual 360°</title>
 <link rel="preconnect" href="https://cdn.jsdelivr.net">
 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">
 <link rel="stylesheet" href="./viewer.css">
</head>
<body>
 <main class="tour-shell">
  <header class="tour-header"><div class="brand-icon">✦</div><div class="tour-heading"><small>RECORRIDO VIRTUAL INTERACTIVO</small><strong id="tourName">Recorrido 360°</strong></div><div class="header-right"><button class="icon-button" id="sceneListToggle" aria-label="Abrir menú de escenas" title="Ver escenas">☷ <span>Escenas</span></button><button class="icon-button" id="fullScreen" aria-label="Pantalla completa" title="Pantalla completa">⛶</button></div></header>
  <section class="photo-stage" id="photoStage"><div class="loading"><div class="loading-mark">✦</div><h1>Preparando recorrido virtual</h1><p>El espacio está a un clic de distancia.</p></div></section>
  <div class="instructions" id="instructions">Arrastra para mirar alrededor · Usa los puntos luminosos para avanzar</div>
  <nav class="scene-panel" id="scenePanel" aria-label="Lista de escenas"><div class="panel-top"><strong>Explorar espacios</strong><button id="closePanel" class="close-panel" aria-label="Cerrar escenas">✕</button></div><div id="sceneButtons" class="scene-buttons"></div></nav>
  <footer class="tour-footer"><button class="nav-arrow" id="goBack" aria-label="Escena anterior">←</button><div class="tour-current"><strong id="currentName">Cargando…</strong><span id="currentNumber"></span></div><div class="footer-tools"><button id="musicButton" class="music-button hidden" title="Reproducir o pausar música">♫ <span>Escuchar música</span></button><button class="nav-arrow" id="goNext" aria-label="Escena siguiente">→</button></div></footer>
  <div class="tour-credit">Creado con Navega360 Studio</div>
 </main>
 <div id="infoOverlay" class="info-overlay hidden"><div class="info-card"><button id="closeInfo" class="info-close" aria-label="Cerrar">✕</button><small>DESCUBRE MÁS</small><h2 id="infoTitle"></h2><p id="infoText"></p><button id="infoOkay" class="info-okay">Continuar explorando</button></div></div>
 <audio id="backgroundAudio" loop preload="none"></audio>
 <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
 <script src="./viewer.js" defer></script>
</body>
</html>
